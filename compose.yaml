# Debrief: the web app, the transcriber, calendar-sync and the MCP server, with Postgres.
#
#   1. Put DB_PASSWORD=<something long> in .env (see .env.example).
#   2. docker compose up -d
#   3. Open http://<server>:3000 and choose a password. Everything else is in Settings.
#
# Optional overlays, added with COMPOSE_FILE in .env:
#   compose.traefik.yaml  HTTPS through Traefik instead of plain ports
#   compose.nas.yaml      a NAS folder to archive recordings to, or to watch for them
name: debrief

# What every Debrief service shares. Anything in .env reaches the services too: a
# setting there (ANTHROPIC_API_KEY=…) wins over Settings and shows as locked.
x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy

x-db: &db
  DATABASE_URL: postgresql://debrief:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/debrief

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: debrief
      POSTGRES_USER: debrief
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Local disk, never NFS: Postgres' WAL doesn't survive network filesystems.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The UI, the recorder's upload API and the database migrations.
  web:
    <<: *app
    image: ghcr.io/vitafortis/debrief-web:${DEBRIEF_TAG:-latest}
    environment:
      <<: *db
    volumes:
      - recordings:/data/recordings
    ports: ["${WEB_PORT:-3000}:3000"]

  transcriber:
    <<: *app
    image: ghcr.io/vitafortis/debrief-transcriber:${DEBRIEF_TAG:-latest}
    environment:
      <<: *db
    volumes:
      - recordings:/data/recordings
      - models:/models

  # Calendars, summaries, Slack, and archiving recordings once they're transcribed.
  calendar-sync:
    <<: *app
    image: ghcr.io/vitafortis/debrief-calendar-sync:${DEBRIEF_TAG:-latest}
    environment:
      <<: *db
    volumes:
      - recordings:/data/recordings

  # Claude connects to http://<server>:3001/mcp with an API key from Settings.
  mcp-server:
    <<: *app
    image: ghcr.io/vitafortis/debrief-mcp:${DEBRIEF_TAG:-latest}
    environment:
      <<: *db
    ports: ["${MCP_PORT:-3001}:3001"]

volumes:
  pgdata:
  # Recordings while they upload and transcribe, and for KEEP_LOCAL_DAYS after they're archived.
  recordings:
  # The Whisper and speaker-label models (about 4 GB), downloaded on first use.
  models:
