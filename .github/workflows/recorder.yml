name: Recorder

# Builds Debrief Recorder for macOS (universal: Apple silicon and Intel) and
# Windows. Unsigned for now. Every build's installers are kept as workflow
# artifacts, and every push to main publishes them as the latest GitHub
# release. The version is major.minor from tauri.conf.json, with this
# workflow's run number as the patch: bump the minor there for a new series.
on:
  push:
    branches: [main]
    paths: ["recorder/**", ".github/workflows/recorder.yml"]
  pull_request:
    paths: ["recorder/**", ".github/workflows/recorder.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version recorder/src-tauri/tauri.conf.json | cut -d. -f1,2).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            ext: .dmg
            files: recorder/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            ext: .exe
            files: recorder/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: recorder/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Unit tests
        working-directory: recorder/src-tauri
        run: cargo test
      - name: Build
        run: |
          echo '{"version":"${{ needs.version.outputs.version }}"}' > version.json
          pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config version.json
      # The same file names every release, so releases/latest/download/<name> always works (Settings → Devices & keys links there).
      - name: Name the installer
        working-directory: .
        run: |
          mkdir dist
          cp ${{ matrix.files }} dist/Debrief-Recorder-${{ runner.os }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: debrief-recorder-${{ runner.os }}
          path: dist/*
          retention-days: 30

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: recorder-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Debrief Recorder ${{ needs.version.outputs.version }}
          make_latest: true
          files: dist/*
          body: Unsigned builds. macOS — open the .dmg, drag to Applications, then right-click → Open the first time. Windows — run the installer; SmartScreen → More info → Run anyway.
