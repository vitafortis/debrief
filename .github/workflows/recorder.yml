name: Recorder

# Builds Debrief Recorder for macOS (universal: Apple silicon and Intel) and
# Windows. With a certificate in the secrets below, the Mac build is signed
# with it, so it keeps its permissions from one version to the next; with a
# Developer ID and the notarizing secrets too, it's notarized and opens without
# a Gatekeeper warning. Without a certificate it's signed ad hoc, as before. Windows is unsigned. Every build's installers are kept as workflow
# artifacts, and every push to main publishes them as the latest GitHub
# release. The version is major.minor from tauri.conf.json, with this
# workflow's run number as the patch: bump the minor there for a new series.
on:
  push:
    branches: [main]
    paths: ["recorder/**", ".github/workflows/recorder.yml"]
  pull_request:
    paths: ["recorder/**", ".github/workflows/recorder.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time per branch, so releases are made in order and the newest
# is the one marked latest. A pull request's newer push cancels its older run;
# on main a newer run waits for the one in progress (cancelling that mid-release
# could leave a release without its installers) and replaces any still waiting.
concurrency:
  group: recorder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      # Whether the Mac build is notarized, for the release notes.
      mac_notarized: ${{ steps.v.outputs.mac_notarized }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          NOTARIZED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
        run: |
          echo "version=$(jq -r .version recorder/src-tauri/tauri.conf.json | cut -d. -f1,2).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "mac_notarized=$NOTARIZED" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            ext: .dmg
            files: recorder/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            ext: .exe
            files: recorder/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: recorder/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Unit tests
        working-directory: recorder/src-tauri
        run: cargo test
      # Repository secrets (see README → Signing the Mac recorder):
      #   APPLE_CERTIFICATE           the signing certificate and key, a .p12 as base64:
      #                               self-signed, or a Developer ID Application one
      #   APPLE_CERTIFICATE_PASSWORD  the .p12's password
      #   APPLE_SIGNING_IDENTITY      the certificate's name, e.g. "Developer ID Application: Your Name (TEAMID)"
      # and, to notarize, which needs a Developer ID:
      #   APPLE_ID, APPLE_PASSWORD    the Apple Account and an app-specific password for it
      #   APPLE_TEAM_ID               the 10-character team ID
      # The certificate goes into a keychain of its own here rather than through
      # Tauri's APPLE_CERTIFICATE, which only finds Apple-issued certificates. A
      # self-signed one is also trusted for code signing, or codesign won't use it.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          [ -n "$CERT" ] || exit 0
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -t 3600 -u "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -T /usr/bin/codesign -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          case "$IDENTITY" in
            "Developer ID Application:"*) ;;
            *)
              security find-certificate -c "$IDENTITY" -p "$kc" > "$RUNNER_TEMP/cert.pem"
              sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
              ;;
          esac
          security find-identity -v -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc" | grep -qF "\"$IDENTITY\""
      # Tauri signs with the identity, and notarizes and staples when the notarizing
      # secrets are in its environment; they're only put there when set, since an
      # empty one would make it try and fail.
      - name: Build
        id: build
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo '{"version":"${{ needs.version.outputs.version }}"}' > version.json
          signed=false notarized=false
          if [ "$RUNNER_OS" = macOS ] && [ -n "$CERT" ]; then
            export APPLE_SIGNING_IDENTITY="$IDENTITY"
            signed=true
            if [ -n "$NOTARY_ID" ]; then
              export APPLE_ID="$NOTARY_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$TEAM_ID"
              notarized=true
            fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"
          pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config version.json
      # Without this entitlement the hardened runtime gives the app silence instead of the microphone, and never asks.
      - name: Check the microphone entitlement
        if: runner.os == 'macOS'
        run: codesign -d --entitlements - --xml "src-tauri/target/universal-apple-darwin/release/bundle/macos/Debrief Recorder.app" | grep -q com.apple.security.device.audio-input
      # Signed with the certificate, not ad hoc; and if notarized, Gatekeeper's own check of the stapled ticket.
      - name: Check the signature
        if: runner.os == 'macOS' && steps.build.outputs.signed == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Debrief Recorder.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -qxF "Authority=$IDENTITY"
          if [ "$NOTARIZED" = true ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi
      # The same file names every release, so releases/latest/download/<name> always works (Settings → Devices & keys links there).
      - name: Name the installer
        working-directory: .
        run: |
          mkdir dist
          cp ${{ matrix.files }} dist/Debrief-Recorder-${{ runner.os }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: debrief-recorder-${{ runner.os }}
          path: dist/*
          retention-days: 30

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Belt and braces for re-runs: only mark it latest if no higher recorder release exists.
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          newest=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name | select(startswith("recorder-v")) | ltrimstr("recorder-v")' | sort -V | tail -n1)
          top=$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n1)
          echo "make_latest=$([ "$top" = "$VERSION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: recorder-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Debrief Recorder ${{ needs.version.outputs.version }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          files: dist/*
          body: |
            macOS — open the .dmg and drag Debrief Recorder to Applications. ${{ needs.version.outputs.mac_notarized == 'true' && 'It is signed and notarized, so it opens like any other app.' || 'It is not notarized: the first time, macOS blocks it; open System Settings → Privacy & Security and click Open Anyway.' }}
            Windows — run the installer. It is unsigned, so SmartScreen may warn: More info → Run anyway.
