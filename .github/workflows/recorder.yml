name: Recorder

# Builds Debrief Recorder for macOS (universal: Apple silicon and Intel) and
# Windows. Unsigned for now. Every build's installers are kept as workflow
# artifacts; a tag recorder-v1.2.3 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    paths: ["recorder/**", ".github/workflows/recorder.yml"]
    tags: ["recorder-v*"]
  pull_request:
    paths: ["recorder/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            files: |
              recorder/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            files: |
              recorder/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: recorder/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Unit tests
        working-directory: recorder/src-tauri
        run: cargo test
      - name: Build
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: debrief-recorder-${{ runner.os }}
          path: ${{ matrix.files }}
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/recorder-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          name: Debrief Recorder ${{ github.ref_name }}
          body: Unsigned builds. macOS — open the .dmg, drag to Applications, then right-click → Open the first time. Windows — run the installer; SmartScreen → More info → Run anyway.
