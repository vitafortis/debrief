[project]
name = "debrief-transcriber"
version = "0.1.0"
description = "Transcribes Debrief recordings with faster-whisper, and optionally watches a NAS folder for more."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2",
  # PyAV 19 dropped av.open(metadata_errors=), which faster-whisper 1.2 passes.
  "av>=11,<19",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Speaker labels. Needs a Hugging Face token with the pyannote model's terms accepted.
diarize = ["pyannote.audio>=4.0"]

[project.scripts]
debrief-transcriber = "debrief_transcriber.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
